# 站点公共配置，由 server 块 include 引用（生产配置和本地测试配置共用）。
# 注意：Nginx 的 add_header 在 location 中出现时会覆盖上层的设置，所以下面的 location 里不使用 add_header。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

index index.html;
charset utf-8;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
gzip_min_length 512;

error_page 404 /404.html;

location /api/ {
    limit_req zone=qc_api burst=10 nodelay;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# 带哈希的构建产物，可以长期缓存
location /_astro/ {
    expires max;
    access_log off;
    try_files $uri =404;
}

location ~* \.(?:png|ico|svg)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
}

location / {
    expires -1;
    try_files $uri $uri/ =404;
}
